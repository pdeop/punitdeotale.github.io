backend:
  name: github
  repo: pdeop/punitdeotale.github.io
  branch: main
  base_url: https://sveltia-cms-auth.punitdeotale.workers.dev

media_folder: static/images
public_folder: /images

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Description", name: "description", widget: "string" }
      - label: "Tags"
        name: "tags"
        widget: "list"
        allow_add: true
      - label: "Category"
        name: "categories"
        widget: "list"
        allow_add: true
        default: ["Technology"]
      - { label: "Author", name: "author", widget: "string", default: "Punit Deotale" }
      - label: "Cover Image"
        name: "cover"
        widget: "object"
        required: false
        fields:
          - { label: "Image", name: "image", widget: "image", required: false }
          - { label: "Alt Text", name: "alt", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    files:
      - label: "About"
        name: "about"
        file: "content/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Layout", name: "layout", widget: "hidden", default: "single" }
          - { label: "Draft", name: "draft", widget: "boolean", default: false }
          - { label: "Description", name: "description", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "categories"
    label: "Categories"
    folder: "content/categories"
    create: true
    nested:
      depth: 2
    slug: "{{slug}}/_index"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown", required: false }
