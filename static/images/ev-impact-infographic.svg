<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="12" fill="url(#bgGrad)" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="48" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a1a" letter-spacing="-0.5">3.5 Years of Electric Driving — By the Numbers</text>
  <line x1="300" y1="62" x2="500" y2="62" stroke="#b07d4f" stroke-width="2" opacity="0.6"/>

  <!-- Row 1: Three vehicle cards -->
  <!-- Tesla Model Y -->
  <rect x="40" y="88" width="225" height="120" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="152" y="118" text-anchor="middle" font-size="11" font-weight="400" fill="#999" letter-spacing="1" text-transform="uppercase">AUG 2022 — OCT 2024</text>
  <text x="152" y="148" text-anchor="middle" font-size="26" font-weight="600" fill="#1a1a1a">33,000</text>
  <text x="152" y="168" text-anchor="middle" font-size="12" font-weight="400" fill="#666">miles</text>
  <text x="152" y="195" text-anchor="middle" font-size="13" font-weight="500" fill="#b07d4f">Tesla Model Y</text>

  <!-- R1S -->
  <rect x="287" y="88" width="225" height="120" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="400" y="118" text-anchor="middle" font-size="11" font-weight="400" fill="#999" letter-spacing="1">MAR 2024 — PRESENT</text>
  <text x="400" y="148" text-anchor="middle" font-size="26" font-weight="600" fill="#1a1a1a">34,614</text>
  <text x="400" y="168" text-anchor="middle" font-size="12" font-weight="400" fill="#666">miles</text>
  <text x="400" y="195" text-anchor="middle" font-size="13" font-weight="500" fill="#b07d4f">Rivian R1S</text>

  <!-- R1T -->
  <rect x="535" y="88" width="225" height="120" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="648" y="118" text-anchor="middle" font-size="11" font-weight="400" fill="#999" letter-spacing="1">OCT 2024 — PRESENT</text>
  <text x="648" y="148" text-anchor="middle" font-size="26" font-weight="600" fill="#1a1a1a">19,358</text>
  <text x="648" y="168" text-anchor="middle" font-size="12" font-weight="400" fill="#666">miles</text>
  <text x="648" y="195" text-anchor="middle" font-size="13" font-weight="500" fill="#b07d4f">Rivian R1T</text>

  <!-- Total miles bar -->
  <rect x="40" y="228" width="720" height="52" rx="8" fill="#1a1a1a"/>
  <text x="400" y="250" text-anchor="middle" font-size="13" font-weight="400" fill="#999" letter-spacing="1">TOTAL ELECTRIC MILES</text>
  <text x="400" y="272" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff" letter-spacing="0.5">87,000</text>

  <!-- Row 2: Impact stats -->
  <!-- Gas saved -->
  <rect x="40" y="300" width="225" height="130" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <circle cx="152" cy="340" r="20" fill="none" stroke="#b07d4f" stroke-width="2" opacity="0.3"/>
  <text x="152" y="346" text-anchor="middle" font-size="18" fill="#b07d4f">&#9981;</text>
  <text x="152" y="380" text-anchor="middle" font-size="28" font-weight="600" fill="#1a1a1a">3,480</text>
  <text x="152" y="400" text-anchor="middle" font-size="12" font-weight="400" fill="#666">gallons of gas saved</text>
  <text x="152" y="420" text-anchor="middle" font-size="11" font-weight="400" fill="#999">vs. 25 MPG equivalent</text>

  <!-- CO2 offset -->
  <rect x="287" y="300" width="225" height="130" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <circle cx="400" cy="340" r="20" fill="none" stroke="#b07d4f" stroke-width="2" opacity="0.3"/>
  <text x="400" y="347" text-anchor="middle" font-size="20" fill="#b07d4f">&#127811;</text>
  <text x="400" y="380" text-anchor="middle" font-size="28" font-weight="600" fill="#1a1a1a">30.8</text>
  <text x="400" y="400" text-anchor="middle" font-size="12" font-weight="400" fill="#666">metric tons CO₂ offset</text>
  <text x="400" y="420" text-anchor="middle" font-size="11" font-weight="400" fill="#999">net of WA grid emissions</text>

  <!-- Trees equivalent -->
  <rect x="535" y="300" width="225" height="130" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <circle cx="648" cy="340" r="20" fill="none" stroke="#b07d4f" stroke-width="2" opacity="0.3"/>
  <text x="648" y="347" text-anchor="middle" font-size="20" fill="#b07d4f">&#127794;</text>
  <text x="648" y="380" text-anchor="middle" font-size="28" font-weight="600" fill="#1a1a1a">1,240</text>
  <text x="648" y="400" text-anchor="middle" font-size="12" font-weight="400" fill="#666">tree seedlings equivalent</text>
  <text x="648" y="420" text-anchor="middle" font-size="11" font-weight="400" fill="#999">growing for 10 years</text>

  <!-- Bottom context bar -->
  <rect x="40" y="450" width="348" height="48" rx="8" fill="#f5f0eb" stroke="#e0d5c8" stroke-width="1"/>
  <text x="214" y="472" text-anchor="middle" font-size="12" font-weight="400" fill="#666">Equivalent to </text>
  <text x="214" y="490" text-anchor="middle" font-size="14" font-weight="600" fill="#b07d4f">7 years of one person's total carbon footprint</text>

  <rect x="412" y="450" width="348" height="48" rx="8" fill="#f5f0eb" stroke="#e0d5c8" stroke-width="1"/>
  <text x="586" y="472" text-anchor="middle" font-size="12" font-weight="400" fill="#666">Equivalent to </text>
  <text x="586" y="490" text-anchor="middle" font-size="14" font-weight="600" fill="#b07d4f">62 round-trip flights SEA ✈ JFK</text>

  <!-- Data date -->
  <text x="400" y="515" text-anchor="middle" font-size="10" font-weight="400" fill="#bbb">Data as of March 29, 2026 · Washington State grid · Well-to-Wheel EPA methodology</text>
</svg>
