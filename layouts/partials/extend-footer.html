{{/* Aurora ambiance — starfield + soft glows behind all content (dark only) */}}
<div class="aurora-glow teal" aria-hidden="true"></div>
<div class="aurora-glow violet" aria-hidden="true"></div>
<canvas id="aurora-sky" aria-hidden="true"></canvas>
<script>
  (function () {
    var c = document.getElementById('aurora-sky');
    if (!c || !document.documentElement.classList.contains('dark')) { if (c) c.style.display = 'none'; return; }
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var ctx = c.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2), stars = [], raf = null, t = 0;
    function seed() {
      var w = c.width, h = c.height, n = Math.max(50, Math.floor((w / dpr) / 14));
      stars = [];
      for (var i = 0; i < n; i++) stars.push({
        x: (Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1) * w,
        y: (Math.abs(Math.sin(i * 78.233) * 12543.331) % 1) * h,
        r: ((Math.abs(Math.sin(i * 3.71)) % 1) * 1.2 + 0.35) * dpr,
        p: (Math.abs(Math.sin(i * 5.17)) % 1) * 6.2832,
        s: 0.3 + (Math.abs(Math.cos(i * 2.31)) % 1) * 0.6,
        hue: i % 9 === 0 ? '157,139,245' : (i % 6 === 0 ? '65,220,200' : '210,214,240')
      });
    }
    function resize() { c.width = Math.floor(window.innerWidth * dpr); c.height = Math.floor(window.innerHeight * dpr); seed(); }
    function draw() {
      ctx.clearRect(0, 0, c.width, c.height);
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i], tw = reduce ? 0.6 : 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * st.s + st.p));
        ctx.globalAlpha = tw; ctx.fillStyle = 'rgb(' + st.hue + ')';
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (!reduce) { t += 0.010; raf = requestAnimationFrame(draw); }
    }
    function start() { if (raf) cancelAnimationFrame(raf); resize(); draw(); }
    window.addEventListener('resize', start, { passive: true });
    start();
  })();
</script>
