{{/* Post card partial — pass a page as context */}}
<a href="{{ .Permalink }}" class="post-card {{ with .Params.heroImage }}post-card-hero{{ end }}">
  {{ with .Params.heroImage }}
  <div class="post-card-img">
    <img src="{{ . | relURL }}" alt="{{ $.Title }}" loading="lazy">
  </div>
  {{ end }}
  <span class="post-card-date">{{ .Date.Format "1/2/2006" }}</span>
  <h3>{{ .Title }}</h3>
  <p>{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 120 }}{{ end }}</p>
  <div class="post-card-meta">
    {{ with .ReadingTime }}<span>{{ . }} min read</span>{{ end }}
  </div>
</a>
